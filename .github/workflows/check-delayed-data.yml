name: Check delayed futures data
on:
  push:
    branches: [autofill-data-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test explicit futures contracts
        shell: python
        run: |
          import urllib.request, urllib.parse, json
          for symbol in ['CLZ26.NYM','NQZ26.CME']:
            url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(symbol,safe='')+'?range=5d&interval=5m'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SessionPath/1.0 (delayed futures context)'})
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              result=data['chart']['result'][0];meta=result['meta']
              print(json.dumps({'symbol':symbol,'meta':{k:meta.get(k) for k in ['symbol','shortName','instrumentType','dataGranularity','regularMarketTime']},'bars':len(result['timestamp']),'first':result['timestamp'][0],'last':result['timestamp'][-1]}))
            except Exception as e: print(symbol,type(e).__name__,str(e))
