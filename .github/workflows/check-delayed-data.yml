name: Check delayed futures data
on:
  push:
    branches: [autofill-data-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test public futures candles
        shell: python
        run: |
          import urllib.request, json, datetime
          for symbol in ['CL=F','NQ=F']:
            url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(symbol,safe='')+'?range=5d&interval=5m'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=json.load(r); cors=r.headers.get('Access-Control-Allow-Origin')
              result=data['chart']['result'][0];meta=result['meta']
              print(json.dumps({'symbol':symbol,'meta':{k:meta.get(k) for k in ['symbol','shortName','longName','instrumentType','exchangeName','fullExchangeName','exchangeTimezoneName','regularMarketTime','exchangeDataDelayedBy']},'bars':len(result['timestamp']),'first':result['timestamp'][0],'last':result['timestamp'][-1],'cors':cors}))
            except Exception as e: print(symbol,type(e).__name__,str(e))
