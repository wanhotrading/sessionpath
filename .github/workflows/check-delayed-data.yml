name: Check delayed futures data
on:
  push:
    branches: [autofill-data-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check NQ midnight source coverage
        shell: python
        run: |
          import urllib.request, json
          for interval in ['5m','1m']:
            try:
              url='https://query1.finance.yahoo.com/v8/finance/chart/NQZ26.CME?range=5d&interval='+interval+'&includePrePost=true'
              req=urllib.request.Request(url,headers={'User-Agent':'SessionPath/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
              item=data['chart']['result'][0];q=item['indicators']['quote'][0];times=item['timestamp']
              subset=[{'t':t,**{k:q[k][i] for k in ['open','high','low','close']}} for i,t in enumerate(times) if 1792468500<=t<=1792469400]
              print(json.dumps({'interval':interval,'bars':len(times),'midnight':subset}))
            except Exception as e: print(interval,type(e).__name__,str(e))
