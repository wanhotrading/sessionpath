name: Refresh delayed futures context
on:
  push:
    branches: [main]
    paths:
      - scripts/collect-context.mjs
      - scripts/context-calculations.mjs
      - .github/workflows/refresh-context.yml
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 7-13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: delayed-futures-context
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test session boundaries and data validation
        run: node --test scripts/context-calculations.test.mjs
      - name: Read delayed front-month candles and publish validated context
        run: node scripts/collect-context.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
